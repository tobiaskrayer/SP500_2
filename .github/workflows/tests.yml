name: Tests

# Läuft bei jedem Push/PR auf main. Die täglichen Analyse-Commits tragen
# "[skip ci]" und lösen den Lauf daher nicht aus.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (netzwerkfrei)
    runs-on: ubuntu-latest

    steps:
      # Erste Versionen auf Node 24 (siehe daily_analysis.yml)
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: pytest tests/ -q
