name: Tägliche S&P500 Analyse

on:
  schedule:
    # Mo–Fr um 21:30 UTC = 16:30 ET (30 Min nach US-Marktschluss)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    # Manueller Start über GitHub UI jederzeit möglich

jobs:
  analyze:
    name: S&P500 Scan
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Erlaubt git push zurück ins Repo

    steps:
      # checkout@v5 / setup-python@v6 sind die ersten Versionen auf Node 24.
      # Bewusst nicht v7: dieser Job pusht mit den von checkout hinterlegten
      # Credentials, und v6 hat genau deren Ablage geändert ("persist creds to a
      # separate file"). v5.0.0 enthält ausschließlich den Node-Bump.
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: S&P500 Analyse durchführen
        run: python run_analysis.py

      - name: Fundamentals-Seed exportieren
        # Macht die beim Scan geholten Ticker.info-Daten als git-getrackten
        # Seed verfügbar — die deployte App spart sich nach dem Redeploy
        # die 50-150 langsamen .info-Calls (siehe analyzer/fundamentals_cache.py).
        run: python -m scripts.export_fundamentals_seed

      - name: Cache-Ergebnis committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explizite Pfadliste statt "git add cache/ history/": ein Blanko-Add
          # würde jedes Laufzeit-Artefakt mitcommitten, das in diesen Ordnern
          # auftaucht — und jede Datei bleibt für immer in der Git-Historie.
          git add cache/results_latest.json \
                  cache/fundamentals_seed.json \
                  cache/sp500_universe.json \
                  history/log/
          # Nur committen wenn sich etwas geändert hat
          if git diff --staged --quiet; then
            echo "Keine neuen Ergebnisse — nichts zu committen."
          else
            git commit -m "Analyse $(date -u +'%Y-%m-%d') [skip ci]"
            git push
          fi
